site_name: Generative GameDev
site_url: https://gamedev.blog/
repo_url: https://github.com/stefanwebb/generative-gamedev/
repo_name: generative-gamedev
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  user_color_mode_toggle: true
  locale: en
  logo: img/vlog-logo.svg
  font:
    text: Quicksand
  palette:
    - scheme: default
      scheme: purple
      primary: purple
      # accent: purple
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - navigation.sections
    - navigation.path
  icon:
    favicon: favicon.ico
    repo: fontawesome/solid/code
    search: fontawesome/solid/magnifying-glass

extra_css:
  - stylesheets/extra.css

nav:
  - About: about.md
  - Vlog:
    - index.md
  - References: references.md

plugins:
  - search
  - blog:
      post_url_format: "{slug}"
      archive: true
      draft_on_serve: false
      blog_dir: .

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/socialmedia.py

extra:
  social:
    - icon: fontawesome/brands/youtube
      name: Generative GameDev on YouTube
      link: https://www.youtube.com/@generative-gamedev
    - icon: fontawesome/brands/threads
      name: Generative GameDev on Threads
      link: https://www.threads.com